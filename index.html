    <script

    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "AW-18558952893");

      // Google Ads conversion: any tap on a phone (tel:) link anywhere on the site,
      // including the AI assistant's Call button. Sends no personal data.
      document.addEventListener(
        "click",
        function (e) {
          var path = e.composedPath ? e.composedPath() : [e.target];
          for (var i = 0; i < path.length; i++) {
            var el = path[i];
            if (
              el &&
              el.tagName === "A" &&
              /^tel:/i.test(el.getAttribute("href") || "")
            ) {
              gtag("event", "conversion", {
                send_to: "AW-18558952893/-ApUCOi_6LUdEL3LzJFF",
              });
              break;
            }
          }
        },
        true,
      );
    </script>

    <script>
      // Apply the visitor's saved text size / high contrast before the page paints
      try {
        var d = JSON.parse(localStorage.getItem("cd-display")) || {};
        var s = { large: "125%", xlarge: "150%" }[d.size];
        if (s) document.documentElement.style.fontSize = s;
        if (d.contrast) document.documentElement.classList.add("high-contrast");
